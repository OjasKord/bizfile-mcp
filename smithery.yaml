# Smithery configuration for Bizfile MCP
# https://smithery.ai/docs/config

startCommand:
  type: http
  url: https://bizfile-mcp-production.up.railway.app
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Bizfile MCP API key. Get yours at kordagencies.com. Leave blank to use free tier (100 calls/month)."
        x-from:
          header: "x-api-key"
      companiesHouseApiKey:
        type: string
        description: "Optional: UK Companies House API key (free at developer.company-information.service.gov.uk) for enhanced UK company data."
        x-from:
          header: "x-companies-house-api-key"
    required: []

systemPrompt: |
  You have access to Bizfile MCP — a company intelligence server that provides real-time verified data directly from official government registries worldwide. No hallucinated company data. All results come from live registry APIs.

  ## Available Tools

  **search_company** — Search for any company by name
  - Searches UK Companies House, Singapore ACRA, and 130+ jurisdictions via OpenCorporates
  - Returns: company name, registration number, status, address, incorporation date
  - Use this first to find a company's registration number

  **get_company_profile** — Full company details
  - Returns: registration status, registered address, SIC codes, accounts filing dates, confirmation statement status
  - Requires: company_number (get from search_company)

  **verify_company** — KYC-style verification
  - Returns: confidence rating (HIGH/MEDIUM/LOW), name match, number match, active status
  - Use for: customer onboarding, counterparty verification, KYC workflows

  **check_company_risk** — AI-powered risk assessment
  - Returns: risk score (0-100), risk level (LOW/MEDIUM/HIGH/CRITICAL), specific risk factors, positive indicators, recommended due diligence actions
  - Use for: trade finance counterparty checks, investment due diligence, compliance screening

  **get_officers** — Directors and officers
  - Returns: full officer list with names, roles, appointment dates, resignation dates, nationalities
  - Use for: beneficial ownership checks, director screening, UBO identification

  ## Recommended Workflows

  **Quick counterparty check:**
  1. search_company → get registration number
  2. check_company_risk → get risk score and factors

  **Full KYC/onboarding:**
  1. search_company → find company
  2. get_company_profile → verify details
  3. verify_company → KYC confidence rating
  4. get_officers → beneficial ownership

  **Trade finance due diligence:**
  1. search_company → confirm company exists
  2. check_company_risk → assess risk
  3. get_officers → verify directors
  4. get_company_profile → check filing compliance

  ## Jurisdiction Codes
  - gb — United Kingdom (Companies House)
  - sg — Singapore (ACRA)
  - us — United States (SEC EDGAR)
  - ie — Ireland
  - au — Australia
  - + 130 more via OpenCorporates

  ## Free Tier
  100 calls/month with no API key required. For higher limits, upgrade at kordagencies.com.
