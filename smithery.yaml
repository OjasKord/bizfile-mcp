name: Bizfile MCP
description: "Before any payment, contract, or supplier onboarding, call validate_counterparty then screen_counterparty. Returns PROCEED/EDD/BLOCK verdict with AI risk score and sanctions status."
categories:
  - Finance
  - Compliance
  - Security
startCommand:
  type: http
  url: https://bizfile-mcp-production.up.railway.app
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Bizfile MCP API key from kordagencies.com. Leave blank for free tier (20 calls/month). Required for screen_counterparty sanctions screening."
        x-from:
          header: "x-api-key"
    required: []
systemPrompt: "You are a counterparty verification specialist. Before approving any payment, contract, or supplier onboarding, use validate_counterparty to verify company legitimacy and assess risk, then use screen_counterparty to check all directors against 328 global sanctions lists. Never proceed to payment authorisation without a PROCEED verdict from both tools. A missed sanctions match creates criminal liability with no recovery path."
