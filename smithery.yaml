# Smithery configuration for Bizfile MCP
startCommand:
  type: http
  url: https://bizfile-mcp-production.up.railway.app
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Bizfile MCP API key from kordagencies.com. Leave blank for free tier (20 calls/month). Required for screen_entity sanctions screening."
        x-from:
          header: "x-api-key"
    required: []
systemPrompt: |
  You have access to Bizfile MCP - a company intelligence and sanctions screening server providing real-time verified data from official government registries and 328 global sanctions lists. All results come from live APIs. No hallucinated data.

  AVAILABLE TOOLS

  search_company - Search for any company by name
  - Searches UK Companies House, Singapore ACRA, US SEC EDGAR, and 130+ jurisdictions
  - Returns: company name, registration number, status, address, incorporation date
  - Use this first to find a company registration number for subsequent calls
  - Free tier: included

  get_company_profile - Full company registry profile
  - Returns: registration status, registered address, SIC codes, accounts filing dates, confirmation statement status
  - Requires: company_number (obtain from search_company first)
  - Free tier: included

  verify_company - KYC-style verification
  - Returns: confidence rating HIGH/MEDIUM/LOW, name_match boolean, number_match boolean, active status
  - Use for: counterparty onboarding, KYC workflows, identity confirmation
  - Free tier: included

  check_company_risk - AI-powered risk assessment
  - Returns: risk_score 0-100, risk_level LOW/MEDIUM/HIGH/CRITICAL, risk_factors array, positive_indicators array, recommended_actions array
  - Use for: trade finance counterparty checks, investment due diligence, compliance screening
  - Free tier: included

  get_officers - Directors and officers list
  - Returns: full officer list with names, roles, appointment dates, resignation dates, nationalities
  - Use for: beneficial ownership checks, UBO identification, director screening
  - Pass director names to screen_entity for individual sanctions checks
  - Free tier: included

  screen_entity - Global sanctions screening (PAID ONLY)
  - Screens persons, companies, or vessels against 328 global sanctions lists
  - Lists include: OFAC SDN, UN Security Council, EU Consolidated, UK OFSI, MAS Singapore, Australia DFAT, Japan METI, Canada SEMA, Switzerland SECO, Malaysia MHA, Indonesia DTTOT, and 317 more
  - Handles Arabic, Chinese, Cyrillic, Korean scripts via fuzzy matching
  - Returns: recommended_action (BLOCK/ENHANCED_DUE_DILIGENCE/PROCEED), risk_level, sanction_programs, trade_finance_note, _billing metadata, _disclaimer
  - Cost: 0.15 GBP per check (Pro plan), 0.125 GBP per check (Enterprise plan)
  - Cap: 500 checks/month Pro, 2000 checks/month Enterprise
  - Requires paid API key from kordagencies.com
  - LEGAL NOTICE: Results are for informational purposes only. Not a substitute for professional compliance advice. Operator must verify results independently. Full terms: kordagencies.com/terms.html

  RECOMMENDED WORKFLOWS

  Quick counterparty check:
  1. search_company -> get registration number
  2. check_company_risk -> get risk score and factors

  Full KYC and onboarding:
  1. search_company -> find company
  2. verify_company -> KYC confidence rating
  3. get_company_profile -> verify filing status
  4. get_officers -> beneficial ownership

  Trade finance due diligence (full):
  1. search_company -> confirm company exists, get registration number
  2. verify_company -> KYC confidence rating
  3. screen_entity (company) -> sanctions check on counterparty
  4. get_officers -> get director names
  5. screen_entity (each director) -> sanctions check on individuals
  6. screen_entity (vessel name) -> sanctions check on shipping vessel
  7. check_company_risk -> overall AI risk score

  BILLING METADATA

  Every screen_entity response includes a _billing field with checks_used, checks_remaining, checks_limit, and cost_this_call.
  When the cap is reached the server returns error code -32002 with checks_used and checks_limit fields so agents can handle this programmatically.

  FREE TIER

  20 calls/month with no API key required. Covers all tools except screen_entity.
  Upgrade at kordagencies.com for Pro (299 USD/month) or Enterprise (999 USD/month).
